# The bench file: paths, profiles, judge, objectives of each role.
# A relative path starts at the root of the repository.

[paths]
modes_file = "configs/modes.toml"
# Add your private datasets here. A file below data/private is always private.
datasets = ["data/public/analyze/cases.yaml"]
filler = "data/public/analyze/filler.yaml"
# The pre-prompt is the text of these files, in this order. To measure the
# prompt of your checkout of the application, put its path here.
preprompt_paths = ["prompts/analyze.md"]
judge_prompt_path = "prompts/judge.md"
runs_dir = "runs"

[transcript]
# The channel names and the partial marker of the application.
mic_label = "VOCE"
system_label = "CHAMADA"
partial_marker = "[partial]"
words_per_minute = 150

[execution]
timeout_s = 60
concurrency = 1
pause_between_requests_s = 0.0
pause_after_error_s = 2.0
seed = 20260919

# ---------------------------------------------------------------------------
# Profiles. In the star design, the complete form of each case goes in each
# transcript length, and each other variant goes in the baseline length only.
# ---------------------------------------------------------------------------

[profiles.smoke]
cases = 2
truncations = [100]
durations_min = [5]
baseline_duration_min = 5
noise_kinds = ["empty"]
noise_instances = 1
repetitions = 1
warmup = 1
max_cost_usd = 1.00

[profiles.quick]
cases = 8
truncations = [50, 80, 100]
durations_min = [5, 30]
baseline_duration_min = 5
asr_wers = [0.10]
noise_kinds = ["empty", "two_words", "hesitation"]
noise_instances = 1
repetitions = 2
warmup = 1
meeting_scenarios = 1
max_cost_usd = 20.00

[profiles.full]
truncations = [50, 70, 80, 90, 100]
durations_min = [5, 15, 30, 60]
baseline_duration_min = 15
asr_wers = [0.05, 0.15]
noise_kinds = ["empty", "two_words", "hesitation"]
noise_instances = 3
repetitions = 3
warmup = 1
design = "star"
meeting_scenarios = 2
max_cost_usd = 150.00

[meeting]
click_minutes = [5, 15, 30, 60]

# ---------------------------------------------------------------------------
# Cost estimate. The estimate comes before each run, and the run does not
# start if the estimate is above max_cost_usd of the profile.
# ---------------------------------------------------------------------------

[cost]
chars_per_token = 3.5
expected_answer_tokens = 220
judge_output_tokens = 160

[cost.expected_reasoning_tokens]
none = 0
minimal = 64
low = 256
medium = 1024
high = 4096
default = 512

# ---------------------------------------------------------------------------
# The judge is fixed, and its family is different from that of each mode.
# ---------------------------------------------------------------------------

[judge]
enabled = true
max_attempts = 3

[judge.mode]
id = "judge"
provider = "openrouter"
model = "anthropic/claude-sonnet-5"
family = "anthropic"

[judge.mode.params]
temperature = 0
max_tokens = 400
provider = { data_collection = "deny" }

[quality_weights]
question = 0.5
utility = 0.3
key_points = 0.2

[stats]
bootstrap_resamples = 2000
confidence = 0.95
seed = 7

# ---------------------------------------------------------------------------
# Objectives. The highest quality within the objective wins. Overlapping
# quality intervals go to the lower TTFAT p95, and then to the lower cost.
# ---------------------------------------------------------------------------

[roles.fast]
ttfat_p95_ms_max = 2000
question_accuracy_min = 0.8

[roles.quality]
ttfat_p95_ms_max = 8000
question_accuracy_min = 0.8

[regression]
p95_increase_ratio = 0.20
