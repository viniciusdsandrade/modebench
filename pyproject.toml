[project]
name = "modebench"
version = "0.1.0"
description = "Benchmark that selects the provider, model and reasoning level for each role of a real-time speech application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "jiwer>=3.0.4",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyyaml>=6.0.1",
    "typer>=0.12",
    "websockets>=14.0",
]

[project.scripts]
modebench = "modebench.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modebench"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# Long lines are left to the formatter. The data tables of the tests hold
# sentences that are clearer on one line.
ignore = ["E501"]

[tool.ruff.lint.isort]
# `helpers` is the shared module of the tests.
known-first-party = ["modebench", "helpers"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["jiwer", "jiwer.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--cov --cov-report=term-missing"

# The core is every module that decides a number or a verdict. The command
# line, the charts and the two connectors that need a live network are the
# thin shell around it, and they stay out of the threshold.
[tool.coverage.run]
source = ["modebench"]
omit = [
    "*/modebench/__main__.py",
    "*/modebench/cli.py",
    "*/modebench/report/plots.py",
    "*/modebench/stt/connector.py",
]

[tool.coverage.report]
# The convention of the project: the core stays at 90 percent or more.
fail_under = 90
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]
